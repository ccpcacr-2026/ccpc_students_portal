<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCPC — Live Bus Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0c1a}

/* ── Map ──────────────────────────────────────────────────── */
#map{position:absolute;inset:0;z-index:1;filter:saturate(0.9) brightness(0.97)}

/* ── Design Tokens ────────────────────────────────────────── */
:root{
  --indigo:       #6366F1;
  --indigo-d:     #4F46E5;
  --violet:       #8B5CF6;
  --cyan:         #06B6D4;
  --green:        #10B981;
  --green-d:      #059669;
  --amber:        #F59E0B;
  --amber-d:      #D97706;
  --red:          #EF4444;
  --panel:        rgba(8,10,28,0.88);
  --panel-light:  rgba(15,18,40,0.82);
  --card:         rgba(255,255,255,0.04);
  --card-hover:   rgba(255,255,255,0.07);
  --border:       rgba(255,255,255,0.07);
  --border-s:     rgba(255,255,255,0.13);
  --text:         #F1F5F9;
  --text-2:       #CBD5E1;
  --text-3:       #64748B;
  --blur:         blur(22px) saturate(160%);
  --r-xl:         22px;
  --r-lg:         16px;
  --r-md:         12px;
  --r-sm:         8px;
}

/* ── Glass Utility ────────────────────────────────────────── */
.glass{
  background:var(--panel);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border-s);
}

/* ── Header Bar ───────────────────────────────────────────── */
#header{
  position:absolute;top:16px;left:16px;right:16px;z-index:1000;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  pointer-events:none;
}

.brand-pill{
  display:flex;align-items:center;gap:13px;
  padding:10px 18px 10px 10px;border-radius:50px;
  pointer-events:auto;
}

.brand-icon{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;color:#fff;
  box-shadow:0 4px 20px rgba(99,102,241,0.45);
}

.brand-text .t1{font-size:0.92rem;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.brand-text .t2{font-size:0.7rem;font-weight:500;color:var(--text-3);margin-top:1px}

.live-pill{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:50px;
  font-size:0.75rem;font-weight:700;color:var(--text);
  pointer-events:auto;letter-spacing:0.02em;
}

.live-ring{
  position:relative;width:10px;height:10px;flex-shrink:0;
}
.live-ring::before,.live-ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;
}
.live-ring::before{background:var(--green);animation:livePulse 2s infinite}
.live-ring::after{background:var(--green);opacity:0.35;animation:livePulse 2s infinite 0.5s;transform:scale(1.8)}

@keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:0.6}}

/* ── Sync Bar (below header, left) ───────────────────────── */
#sync-bar{
  position:absolute;top:80px;left:16px;z-index:999;
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:50px;
  font-size:0.7rem;font-weight:600;color:var(--text-3);
  pointer-events:none;
}
#sync-bar .countdown{
  color:var(--cyan);font-weight:800;
}
#sync-bar .dot-sync{
  width:6px;height:6px;border-radius:50%;
  background:var(--text-3);flex-shrink:0;
}
#sync-bar.syncing .dot-sync{background:var(--amber);animation:blinkDot 0.6s infinite}
#sync-bar.ok     .dot-sync{background:var(--green)}
#sync-bar.error  .dot-sync{background:var(--red)}

@keyframes blinkDot{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── Bus Panel (sidebar) ──────────────────────────────────── */
#bus-panel{
  position:absolute;
  top:110px;left:16px;
  width:310px;z-index:1000;
  display:flex;flex-direction:column;
  max-height:calc(100vh - 126px);
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;margin-bottom:8px;border-radius:var(--r-xl);
}

.panel-head-left{
  display:flex;align-items:center;gap:8px;
  font-size:0.85rem;font-weight:800;color:var(--text);
}

.fleet-badge{
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  color:#fff;font-size:0.62rem;font-weight:800;
  padding:2px 8px;border-radius:20px;letter-spacing:0.02em;
}

.sel-btns{display:flex;gap:6px}

.sel-btn{
  border:1px solid var(--border-s);background:var(--card);
  color:var(--text-2);font-size:0.7rem;font-weight:700;
  padding:5px 13px;border-radius:50px;cursor:pointer;
  transition:all 0.18s;letter-spacing:0.02em;
}
.sel-btn:hover{background:var(--indigo);border-color:var(--indigo);color:#fff;transform:scale(0.97)}
.sel-btn.primary{background:linear-gradient(135deg,var(--indigo),var(--violet));border-color:transparent;color:#fff}
.sel-btn.primary:hover{opacity:0.85}

/* ── Bus List ─────────────────────────────────────────────── */
#bus-list{
  overflow-y:auto;display:flex;flex-direction:column;gap:7px;
  padding-bottom:16px;scrollbar-width:none;
}
#bus-list::-webkit-scrollbar{display:none}

.bus-card{
  border-radius:var(--r-lg);padding:13px 14px 12px;
  cursor:pointer;position:relative;overflow:hidden;
  border:1px solid var(--border);
  background:var(--panel-light);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:all 0.22s cubic-bezier(0.4,0,0.2,1);
}
.bus-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;border-radius:3px 0 0 3px;
  background:var(--text-3);transition:background 0.22s;
}
.bus-card.moving::before{background:linear-gradient(180deg,var(--green),var(--green-d))}
.bus-card.idle::before  {background:linear-gradient(180deg,var(--amber),var(--amber-d))}
.bus-card:hover{transform:translateX(4px);border-color:var(--border-s);background:var(--card-hover)}
.bus-card.focused{border-color:rgba(99,102,241,0.45);background:rgba(99,102,241,0.06)}
.bus-card.dimmed{opacity:0.38}

.bc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.bus-avatar{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,0.3);
}
.bus-avatar.moving{background:linear-gradient(135deg,var(--green),var(--green-d))}
.bus-avatar.idle  {background:linear-gradient(135deg,var(--amber),var(--amber-d))}

.bc-info{flex:1;min-width:0}

.bc-name{
  font-size:0.87rem;font-weight:800;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.2;
}
.bc-name.focused-name{
  background:linear-gradient(90deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.bc-status{
  display:flex;align-items:center;gap:5px;margin-top:2px;
}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.moving{background:var(--green);animation:statusBlink 2.5s infinite}
.status-dot.idle  {background:var(--amber)}
@keyframes statusBlink{0%,100%{opacity:1}50%{opacity:0.3}}

.status-text{font-size:0.68rem;font-weight:700;color:var(--text-3);letter-spacing:0.03em;text-transform:uppercase}
.status-text.moving{color:var(--green)}
.status-text.idle  {color:var(--amber)}

.bc-check{
  width:18px;height:18px;flex-shrink:0;cursor:pointer;
  accent-color:var(--indigo);border-radius:4px;
}

.bc-bottom{display:flex;align-items:center;gap:8px}

/* Speed bar */
.speed-wrap{flex:1;min-width:0}
.speed-top{
  display:flex;justify-content:space-between;
  font-size:0.67rem;font-weight:700;color:var(--text-3);
  margin-bottom:4px;
}
.speed-val{color:var(--text-2)}
.speed-track{height:3px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.speed-fill{
  height:100%;border-radius:3px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.speed-fill.moving{background:linear-gradient(90deg,var(--green),var(--cyan))}
.speed-fill.idle  {background:var(--amber);width:0%!important}

.bc-addr{
  font-size:0.68rem;font-weight:500;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:4px;margin-top:7px;
}
.bc-addr i{color:var(--indigo);flex-shrink:0;font-size:0.72rem}

/* empty state */
.bus-empty{
  text-align:center;color:var(--text-3);font-size:0.8rem;
  padding:28px 16px;
}
.bus-empty i{font-size:2rem;display:block;margin-bottom:10px;color:var(--text-3)}

/* ── Details Panel ────────────────────────────────────────── */
#details-panel{
  position:absolute;bottom:24px;right:60px;
  width:300px;z-index:1001;display:none;
  border-radius:var(--r-xl);overflow:hidden;
}

.dp-header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.1));
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;
}
.dp-name{
  font-size:1.05rem;font-weight:900;color:var(--text);letter-spacing:-0.01em;
}
.dp-close{
  background:rgba(255,255,255,0.08);border:none;
  color:var(--text-3);width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:0.8rem;flex-shrink:0;
  transition:all 0.18s;
}
.dp-close:hover{background:rgba(255,255,255,0.15);color:var(--text)}

.dp-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}

.dp-row{display:flex;gap:10px}

.dp-stat{
  flex:1;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:10px 12px;
}
.dp-stat-label{
  font-size:0.58rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--text-3);margin-bottom:4px;
}
.dp-stat-val{font-size:1rem;font-weight:800;color:var(--text);line-height:1}
.dp-stat-sub{font-size:0.65rem;color:var(--text-3);margin-top:2px}

.dp-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:50px;
  font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
}
.dp-badge.moving{background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.25)}
.dp-badge.idle  {background:rgba(245,158,11,0.15);color:var(--amber);border:1px solid rgba(245,158,11,0.25)}

.dp-loc{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:10px 12px;
  display:flex;align-items:flex-start;gap:8px;
}
.dp-loc-icon{
  color:var(--indigo);font-size:1rem;margin-top:1px;flex-shrink:0;
}
.dp-loc-text{
  font-size:0.78rem;font-weight:600;color:var(--text-2);line-height:1.4;
}

.dp-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:10px;border-top:1px solid var(--border);
}
.dp-time{font-size:0.67rem;font-weight:600;color:var(--text-3)}
.dp-engine{
  display:flex;align-items:center;gap:5px;
  font-size:0.67rem;font-weight:700;
}
.engine-on {color:var(--green)}
.engine-off{color:var(--text-3)}

/* ── Map Markers ──────────────────────────────────────────── */
.bm-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.bm-pulse{
  position:absolute;inset:-7px;border-radius:50%;
  border:2px solid var(--green);
  animation:markerRing 2s ease-out infinite;pointer-events:none;
}
@keyframes markerRing{
  0%  {transform:scale(0.9);opacity:0.7}
  100%{transform:scale(1.6);opacity:0}
}
.bm-circle{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.35);
  position:relative;z-index:1;
}
.bm-circle svg{width:22px;height:22px;fill:white}

.bus-label{
  background:rgba(8,10,28,0.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;color:#F1F5F9;
  font-family:'Inter',sans-serif;
  font-weight:700;font-size:0.7rem;
  padding:4px 10px;
  box-shadow:0 4px 14px rgba(0,0,0,0.3);
  white-space:nowrap;
}
.bus-label::before{display:none}

/* ── Mobile ───────────────────────────────────────────────── */
@media(max-width:768px){
  #bus-panel{
    top:auto;bottom:16px;left:0;right:0;
    width:100%;max-height:230px;flex-direction:column;
  }
  .panel-head{border-radius:0}
  #bus-list{
    flex-direction:row;overflow-x:auto;overflow-y:hidden;
    padding:0 12px 10px;gap:8px;
  }
  .bus-card{min-width:240px;flex-shrink:0}
  #details-panel{
    left:16px;right:16px;width:auto;bottom:248px;
  }
  #sync-bar{top:80px}
}

/* ── Scrollbar (thin) ─────────────────────────────────────── */
*::-webkit-scrollbar{width:4px;height:4px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}
</style>
</head>
<body>

<div id="map"></div>

<!-- ── Header ── -->
<div id="header">
  <div class="glass brand-pill">
    <div class="brand-icon"><i class="bi bi-bus-front-fill"></i></div>
    <div class="brand-text">
      <div class="t1">CCPC Live Tracker</div>
      <div class="t2" id="sync-label">Connecting to GPS...</div>
    </div>
  </div>
  <div class="glass live-pill">
    <div class="live-ring"></div>
    <span id="live-trackers">0</span>&nbsp;Watching
  </div>
</div>

<!-- ── Sync Bar ── -->
<div id="sync-bar" class="glass">
  <div class="dot-sync"></div>
  <span id="sync-text">Initializing...</span>
  <span class="countdown" id="countdown-text"></span>
</div>

<!-- ── Bus Panel ── -->
<div id="bus-panel">
  <div class="glass panel-head">
    <div class="panel-head-left">
      <i class="bi bi-grid-3x3-gap-fill" style="color:var(--indigo);font-size:0.9rem"></i>
      Fleet
      <span class="fleet-badge" id="bus-count">0</span>
    </div>
    <div class="sel-btns">
      <button class="sel-btn primary" onclick="selectAll()">All</button>
      <button class="sel-btn"         onclick="selectNone()">None</button>
      <button class="sel-btn"         onclick="fitSelected()" title="Fit map"><i class="bi bi-fullscreen"></i></button>
    </div>
  </div>
  <div id="bus-list">
    <div class="bus-empty">
      <i class="bi bi-broadcast"></i>
      Waiting for GPS data…
    </div>
  </div>
</div>

<!-- ── Details Panel ── -->
<div id="details-panel" class="glass">
  <div class="dp-header">
    <div>
      <div class="dp-name" id="det-name">—</div>
      <div id="det-badge" class="dp-badge moving" style="margin-top:6px">● Moving</div>
    </div>
    <button class="dp-close" onclick="closeDetails()"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="dp-body">
    <div class="dp-row">
      <div class="dp-stat">
        <div class="dp-stat-label">Speed</div>
        <div class="dp-stat-val" id="det-speed">—</div>
        <div class="dp-stat-sub">km / h</div>
      </div>
      <div class="dp-stat">
        <div class="dp-stat-label">Engine</div>
        <div class="dp-engine" id="det-engine"><i class="bi bi-circle-fill" style="font-size:0.55rem"></i> —</div>
        <div class="dp-stat-sub" id="det-time">GPS: —</div>
      </div>
    </div>
    <div class="dp-loc">
      <i class="bi bi-geo-alt-fill dp-loc-icon"></i>
      <div class="dp-loc-text" id="det-address">—</div>
    </div>
    <div class="dp-footer">
      <span class="dp-time" id="det-coords">—</span>
      <span style="font-size:0.67rem;color:var(--indigo);font-weight:700">
        <i class="bi bi-broadcast"></i> LIVE
      </span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── State ──────────────────────────────────────────────────
let map;
let markers     = {};
let allBusData  = {};
let selectedSet = new Set();
let activeImei  = null;
let pollTimeout = null;
let cdInterval  = null;
let cdVal       = 30;
const POLL_MS   = 30000;

const trackerId = sessionStorage.getItem('_tid') || 'u' + Math.random().toString(36).slice(2,8);
sessionStorage.setItem('_tid', trackerId);

// ── Map ────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl:false, attributionControl:false })
         .setView([22.3569, 91.7832], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  startSync();
}

// ── Countdown ──────────────────────────────────────────────
function startCountdown() {
  if (cdInterval) clearInterval(cdInterval);
  cdVal = 30;
  updateCountdown();
  cdInterval = setInterval(() => {
    cdVal = Math.max(0, cdVal - 1);
    updateCountdown();
  }, 1000);
}
function updateCountdown() {
  const el = document.getElementById('countdown-text');
  if (el) el.textContent = cdVal > 0 ? `· next in ${cdVal}s` : '';
}

// ── Polling ────────────────────────────────────────────────
function setSyncState(state, text) {
  const bar = document.getElementById('sync-bar');
  bar.className = 'glass ' + state;
  document.getElementById('sync-text').textContent = text;
}

function startSync() {
  if (pollTimeout) clearTimeout(pollTimeout);
  setSyncState('syncing', 'Fetching location…');

  fetch('/api/portal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'get_bus_data', payload: { tracker_id: trackerId } })
  })
  .then(r => r.json())
  .then(res => {
    if (res.result === 'success') {
      applyServerData(res.data);
      document.getElementById('live-trackers').textContent = res.trackers || '0';
      const age = res.dataAge > 0 ? ` · GPS ${res.dataAge}s old` : ' · Live';
      document.getElementById('sync-label').textContent =
        'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + age;
      setSyncState('ok', 'Location synced');
    } else {
      setSyncState('error', res.message || 'Error');
    }
    startCountdown();
    pollTimeout = setTimeout(startSync, POLL_MS);
  })
  .catch(() => {
    setSyncState('error', 'Connection lost');
    startCountdown();
    pollTimeout = setTimeout(startSync, POLL_MS);
  });
}

// ── Data ───────────────────────────────────────────────────
function applyServerData(buses) {
  const incoming = {};
  buses.forEach(b => incoming[b.imei] = b);

  buses.forEach(b => { if (!allBusData[b.imei]) selectedSet.add(b.imei); });

  Object.keys(allBusData).forEach(id => {
    if (!incoming[id]) { selectedSet.delete(id); removeMarker(id); }
  });

  allBusData = incoming;
  redrawMap();
  renderSidebar();

  if (Object.keys(markers).length === 0 && Object.keys(allBusData).length > 0) fitSelected();
}

// ── Markers ────────────────────────────────────────────────
function makeBusIcon(bus) {
  const mv    = bus.isMoving;
  const color = mv ? '#10B981' : '#F59E0B';
  const dark  = mv ? '#047857' : '#B45309';
  const glow  = mv ? 'rgba(16,185,129,0.45)' : 'rgba(245,158,11,0.4)';
  const pulse = mv
    ? `<div class="bm-pulse" style="border-color:${color}"></div>` : '';

  return L.divIcon({
    className: '',
    html: `<div class="bm-wrap">
      ${pulse}
      <div class="bm-circle" style="background:linear-gradient(135deg,${color},${dark});box-shadow:0 4px 20px ${glow}">
        <svg viewBox="0 0 24 24"><path d="M18 11h-1V7c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v10h1c0 1.1.9 2 2 2s2-.9 2-2h6c0 1.1.9 2 2 2s2-.9 2-2h1v-4c0-1.1-.9-2-2-2zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm11 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-7H5V7h11v4z"/></svg>
      </div>
    </div>`,
    iconSize: [44, 52],
    iconAnchor: [22, 22]
  });
}

function removeMarker(id) {
  if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
}

function markerLabel(bus) {
  const spd = parseFloat(bus.speed) > 0 ? `${bus.speed} km/h` : 'Idle';
  return `<b>${bus.name}</b> · ${spd}`;
}

function redrawMap() {
  Object.keys(allBusData).forEach(id => {
    const bus     = allBusData[id];
    const visible = selectedSet.has(id);
    const pos     = [bus.lat, bus.lng];

    if (!visible) { removeMarker(id); return; }

    if (!markers[id]) {
      const m = L.marker(pos, { icon: makeBusIcon(bus) }).addTo(map);
      m.bindTooltip(markerLabel(bus), {
        permanent:true, direction:'top',
        className:'bus-label', offset:[0,-16]
      });
      m.on('click', () => focusBus(id));
      markers[id] = m;
    } else {
      markers[id].setLatLng(pos);
      markers[id].setIcon(makeBusIcon(bus));
      markers[id].setTooltipContent(markerLabel(bus));
    }

    if (activeImei === id) markers[id].closeTooltip();
    else markers[id].openTooltip();
  });

  if (activeImei && allBusData[activeImei] && selectedSet.has(activeImei)) {
    updateDetailsPanel(allBusData[activeImei]);
  }
}

// ── Sidebar ────────────────────────────────────────────────
function renderSidebar() {
  const list  = document.getElementById('bus-list');
  const buses = Object.values(allBusData);
  document.getElementById('bus-count').textContent = buses.length;

  if (!buses.length) {
    list.innerHTML = `<div class="bus-empty"><i class="bi bi-exclamation-circle"></i>No buses configured yet</div>`;
    return;
  }

  list.innerHTML = buses.map(bus => {
    const sel     = selectedSet.has(bus.imei);
    const focused = activeImei === bus.imei;
    const mv      = bus.isMoving;
    const spd     = parseFloat(bus.speed) || 0;
    const spdPct  = Math.min(100, Math.round(spd / 80 * 100));
    const addr    = bus.address.length > 30 ? bus.address.slice(0,30) + '…' : bus.address;

    return `
    <div class="bus-card ${mv?'moving':'idle'} ${focused?'focused':''} ${!sel?'dimmed':''}"
         onclick="focusBus('${bus.imei}')">

      <div class="bc-top">
        <div class="bus-avatar ${mv?'moving':'idle'}">
          <i class="bi bi-bus-front-fill"></i>
        </div>
        <div class="bc-info">
          <div class="bc-name ${focused?'focused-name':''}">${bus.name}</div>
          <div class="bc-status">
            <div class="status-dot ${mv?'moving':'idle'}"></div>
            <span class="status-text ${mv?'moving':'idle'}">${mv?'Moving':'Idle'}</span>
          </div>
        </div>
        <input class="bc-check" type="checkbox" ${sel?'checked':''}
               onclick="event.stopPropagation()"
               onchange="toggleBus('${bus.imei}',this.checked)">
      </div>

      <div class="bc-bottom">
        <div class="speed-wrap">
          <div class="speed-top">
            <span>Speed</span>
            <span class="speed-val">${spd} km/h</span>
          </div>
          <div class="speed-track">
            <div class="speed-fill ${mv?'moving':'idle'}" style="width:${spdPct}%"></div>
          </div>
        </div>
      </div>

      <div class="bc-addr">
        <i class="bi bi-geo-alt-fill"></i>${addr}
      </div>
    </div>`;
  }).join('');
}

// ── Selection ──────────────────────────────────────────────
function toggleBus(id, checked) {
  if (checked) selectedSet.add(id);
  else { selectedSet.delete(id); if (activeImei === id) closeDetails(); }
  redrawMap();
  renderSidebar();
}

function selectAll() {
  Object.keys(allBusData).forEach(id => selectedSet.add(id));
  redrawMap(); renderSidebar(); fitSelected();
}

function selectNone() {
  selectedSet.clear(); closeDetails(); redrawMap(); renderSidebar();
}

function fitSelected() {
  const pts = Object.keys(allBusData)
    .filter(id => selectedSet.has(id))
    .map(id => [allBusData[id].lat, allBusData[id].lng]);
  if (pts.length > 1) map.fitBounds(pts, { padding:[70,70] });
  else if (pts.length === 1) map.flyTo(pts[0], 15);
}

// ── Details ────────────────────────────────────────────────
function focusBus(id) {
  const bus = allBusData[id];
  if (!bus) return;
  if (!selectedSet.has(id)) { selectedSet.add(id); redrawMap(); }
  activeImei = id;
  map.flyTo([bus.lat, bus.lng], 16);
  document.getElementById('details-panel').style.display = 'block';
  updateDetailsPanel(bus);
  Object.keys(markers).forEach(k => {
    if (k === id) markers[k].closeTooltip();
    else markers[k].openTooltip();
  });
  renderSidebar();
}

function updateDetailsPanel(bus) {
  const mv  = bus.isMoving;
  const spd = parseFloat(bus.speed) || 0;
  const eng = bus.engine;

  document.getElementById('det-name').textContent    = bus.name;
  document.getElementById('det-speed').textContent   = spd;
  document.getElementById('det-address').textContent = bus.address;
  document.getElementById('det-time').textContent    = 'GPS ' + (bus.time ? bus.time.split(' ')[1] : '—');
  document.getElementById('det-coords').textContent  =
    bus.lat && bus.lng ? `${Number(bus.lat).toFixed(4)}, ${Number(bus.lng).toFixed(4)}` : '—';

  const badge = document.getElementById('det-badge');
  badge.className   = 'dp-badge ' + (mv ? 'moving' : 'idle');
  badge.textContent = mv ? '● Moving' : '● Idle';

  const engEl = document.getElementById('det-engine');
  engEl.className   = 'dp-engine ' + (eng ? 'engine-on' : 'engine-off');
  engEl.innerHTML   = `<i class="bi bi-circle-fill" style="font-size:0.55rem"></i> ${eng ? 'Engine On' : 'Engine Off'}`;
}

function closeDetails() {
  activeImei = null;
  document.getElementById('details-panel').style.display = 'none';
  Object.keys(markers).forEach(id => markers[id].openTooltip());
  renderSidebar();
}

initMap();
</script>
</body>
</html>
